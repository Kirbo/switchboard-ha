run_action:
  fields:
    action_type:
      required: true
      example: obs_scene_set
      selector:
        text:
    target:
      example: Home OBS
      selector:
        text:
    value:
      example: Gaming
      selector:
        text:
    action_params:
      example: '{"remember": true}'
      selector:
        object:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: switchboard

obs_scene_set:
  fields:
    target:
      required: true
      example: Home OBS
      selector:
        text:
    scene:
      required: true
      example: Gaming
      selector:
        text:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: switchboard

overlay_alert:
  fields:
    text:
      required: true
      example: Be right back!
      selector:
        text:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: switchboard

set_machine_state:
  fields:
    state:
      required: true
      example: afk
      selector:
        select:
          options:
            - afk
            - active
    entry_id:
      required: false
      selector:
        config_entry:
          integration: switchboard

light_flash:
  fields:
    entity_id:
      required: true
      example: light.studio_key
      selector:
        text:
    target:
      required: false
      example: Home Assistant
      selector:
        text:
    flashes:
      required: false
      example: 3
      selector:
        number:
          min: 1
          max: 20
          mode: box
    color:
      required: false
      example: "#a855f7"
      selector:
        text:
    brightness:
      required: false
      example: 255
      selector:
        number:
          min: 1
          max: 255
          mode: slider
    color_temp_kelvin:
      required: false
      example: 4000
      selector:
        number:
          min: 2000
          max: 6500
          step: 100
          unit_of_measurement: K
          mode: box
    on_ms:
      required: false
      example: 500
      selector:
        number:
          min: 100
          max: 5000
          step: 50
          unit_of_measurement: ms
          mode: box
    off_ms:
      required: false
      example: 500
      selector:
        number:
          min: 100
          max: 5000
          step: 50
          unit_of_measurement: ms
          mode: box
    transition_ms:
      required: false
      example: 150
      selector:
        number:
          min: 0
          max: 5000
          step: 50
          unit_of_measurement: ms
          mode: box
    entry_id:
      required: false
      selector:
        config_entry:
          integration: switchboard

afk_snooze:
  fields:
    seconds:
      required: true
      example: 900
      selector:
        number:
          min: 0
          max: 14400
          step: 30
          unit_of_measurement: s
          mode: box
    entry_id:
      required: false
      selector:
        config_entry:
          integration: switchboard

afk_reset_idle:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: switchboard

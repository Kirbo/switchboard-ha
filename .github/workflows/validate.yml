name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *"

# Least privilege by default; only the release job (below) asks for `contents: write`.
permissions:
  contents: read

# mise installs ONLY what the committed mise.lock names (version + URL + checksum per platform) — a
# tool, version or artifact missing from the lock fails the job instead of being fetched.
env:
  MISE_LOCKED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.2
      - name: ruff check + format --check
        run: mise run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.2
      # Provisions .venv (uv + requirements-test.txt) and runs pytest against a real
      # Home Assistant — this is what guards the docs/HA.md contract from upstream drift.
      - name: pytest
        run: mise run test

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to a commit (main as of 2026-09-02) — a mutable branch ref in the repo that ships
      # to users is a supply-chain hole; bump deliberately.
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same: pinned to master as of 2026-09-02.
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [lint, test, hacs, hassfest]
    # Only cut releases on pushes to main, after validation passes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.2
      - name: CalVer release (git-cliff notes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release.sh
